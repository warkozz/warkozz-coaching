<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion — WarkozZ Coaching</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/reset.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/buttons.css">
<link rel="stylesheet" href="assets/css/header.css">
<link rel="stylesheet" href="assets/css/forms.css">
<link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>

<header class="site-header">
  <div class="wrap nav">
    <a href="index.html" class="logo">
      <span class="logo-mark">WK</span>
      <span class="logo-text">WarkozZ</span>
    </a>
    <div class="nav-actions">
      <a href="index.html" class="btn btn-outline">Retour au site</a>
    </div>
  </div>
</header>

<main class="login-wrap">
  <div class="login-card">
    <h1>Connexion</h1>
    <p>Accède à ton espace élève pour réserver une session ou suivre ta progression.</p>
    <form onsubmit="return false;">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="toi@exemple.com" required>
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
    </form>
    <p class="login-alt">Pas encore de compte ? <a href="#">S'inscrire</a></p>
  </div>
</main>

</body>
</html>
